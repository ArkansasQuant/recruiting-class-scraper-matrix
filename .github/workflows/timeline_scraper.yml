name: Run Player Timeline Scraper (Multi-Year 2008-2027)

on:
  workflow_dispatch:
    inputs:
      years_to_scrape:
        description: 'Years: ranges (2021-2024), lists (2023, 2024, 2008), or mixed (2008, 2015-2017, 2024)'
        required: true
        type: string
        default: '2024'
      test_mode:
        description: 'Test mode (50 players) or Full scrape'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  # Job 1: Determine which years to run based on user selection
  setup:
    runs-on: ubuntu-22.04
    outputs:
      years: ${{ steps.set-years.outputs.years }}
    steps:
      - id: set-years
        shell: python
        run: |
          import json, os, re, sys

          raw = os.environ['YEARS_INPUT'].strip()
          MIN_YEAR, MAX_YEAR = 2000, 2030
          years = set()

          for token in raw.split(','):
              token = token.strip()
              if not token:
                  continue
              m = re.fullmatch(r'(\d{4})\s*-\s*(\d{4})', token)
              if m:
                  start, end = int(m.group(1)), int(m.group(2))
                  if start > end:
                      start, end = end, start
                  for y in range(start, end + 1):
                      years.add(y)
              elif re.fullmatch(r'\d{4}', token):
                  years.add(int(token))
              else:
                  print(f'::error::Unrecognized token: "{token}". Use 2024, 2021-2024, or 2023, 2024, 2008.')
                  sys.exit(1)

          if not years:
              print('::error::No years parsed from input.')
              sys.exit(1)

          bad = sorted(y for y in years if not (MIN_YEAR <= y <= MAX_YEAR))
          if bad:
              print(f'::error::Year(s) out of range {MIN_YEAR}-{MAX_YEAR}: {bad}')
              sys.exit(1)

          ordered = [str(y) for y in sorted(years)]
          print(f'Parsed years: {ordered}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write('years=' + json.dumps(ordered) + '\n')
        env:
          YEARS_INPUT: ${{ github.event.inputs.years_to_scrape }}

  # Job 2: Scrape timelines for selected years in parallel
  scrape:
    needs: setup
    strategy:
      matrix:
        year: ${{ fromJson(needs.setup.outputs.years) }}
      fail-fast: false
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    name: Timeline ${{ matrix.year }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        playwright install --with-deps chromium

    - name: Run timeline scraper for ${{ matrix.year }}
      run: python timeline_scraper.py
      env:
        TEST_MODE: ${{ github.event.inputs.test_mode }}
        SCRAPE_YEAR: ${{ matrix.year }}

    - name: Upload CSV for combination
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: timeline_for_combine_${{ matrix.year }}
        path: output/*.csv
        retention-days: 7

    - name: Upload individual timeline CSV for ${{ matrix.year }}
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Timeline_Output_${{ matrix.year }}
        path: output/*.csv
        retention-days: 90

  # Job 3: Combine all timeline CSVs into one
  combine:
    needs: scrape
    runs-on: ubuntu-22.04
    if: always()
    steps:
    - name: Download all CSV artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: timeline_for_combine_*
        path: downloaded_csvs
        merge-multiple: true

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install pandas
      run: pip install pandas

    - name: Combine CSVs
      run: |
        python3 << 'EOF'
        import pandas as pd
        import glob
        import os
        from datetime import datetime

        csv_files = glob.glob('downloaded_csvs/*.csv')
        if not csv_files:
            print("⚠️  No CSV files found to combine")
            exit(0)

        print(f"📊 Found {len(csv_files)} CSV files to combine")
        dfs = []
        for file in sorted(csv_files):
            print(f"  → Reading {os.path.basename(file)}")
            dfs.append(pd.read_csv(file))

        combined = pd.concat(dfs, ignore_index=True)

        # Sort by class year (desc), then player (by unique 247 ID), then event
        # date (asc). Grouping by 247 ID rather than name prevents two players who
        # share a name from interleaving. NaT dates (No Events Found) sort last.
        combined['High School Class'] = pd.to_numeric(combined['High School Class'], errors='coerce')
        combined['__d'] = pd.to_datetime(combined['Event Date'], format='%m/%d/%Y', errors='coerce')
        combined = combined.sort_values(
            by=['High School Class', '247 ID', '__d'],
            ascending=[False, True, True],
            na_position='last'
        ).drop(columns='__d')

        years = sorted(combined['High School Class'].dropna().unique().astype(int))
        year_range = f"{min(years)}-{max(years)}" if len(years) > 1 else str(years[0])
        timestamp = datetime.now().strftime('%Y%m%d')
        output_file = f'player_timeline_{year_range}_combined_{timestamp}.csv'
        combined.to_csv(output_file, index=False)

        print(f"\n✅ Combined CSV created: {output_file}")
        print(f"📊 Total event rows: {len(combined):,}")
        print(f"👤 Unique players: {combined['247 ID'].nunique():,}")
        print(f"📅 Years covered: {year_range}")
        print(f"📏 File size: {os.path.getsize(output_file)/1024/1024:.2f} MB")
        EOF

    - name: Upload combined timeline CSV
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Combined_Timeline_All_Years
        path: player_timeline_*_combined_*.csv
        retention-days: 90

    - name: Display summary
      if: always()
      run: |
        echo "=========================================="
        echo "🎉 TIMELINE SCRAPING COMPLETE!"
        echo "=========================================="
        echo ""
        echo "📦 Artifacts created:"
        echo "  • Combined_Timeline_All_Years (single long-format file)"
        echo "  • Timeline_Output_YEAR (individual files per year)"
        echo ""
        echo "Each row = one timeline event. Pivot in Excel by Event Type / Event Team."
        echo "=========================================="
